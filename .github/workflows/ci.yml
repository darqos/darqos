name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Ruff needs nothing else: install just the version pinned for development.
      - name: Install ruff
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      # Files and rules are configured in pyproject.toml.
      - name: Run ruff
        run: ruff check --output-format=github

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Pyright resolves imports against the installed packages.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Files are configured in pyproject.toml.
      - name: Run pyright
        run: pyright

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Importing darq pulls in PyQt6, which needs the system GL libraries.
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The PDF is built with LaTeX: these are the packages Sphinx's
      # LaTeX builder needs.
      - name: Install system packages
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          latexmk texlive-latex-recommended texlive-latex-extra
          texlive-fonts-recommended tex-gyre

      # The docs import nothing from darq: install just the pinned Sphinx,
      # and its theme.
      - name: Install sphinx
        run: pip install "$(grep '^sphinx==' requirements-dev.txt)" "$(grep '^sphinx-book-theme==' requirements-dev.txt)"

      # Warnings are errors (see doc/Makefile).
      - name: Build HTML
        run: make -C doc html

      - name: Build PDF
        run: make -C doc latexpdf

      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: |
            doc/_build/html
            doc/_build/latex/darqos.pdf
