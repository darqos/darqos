[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "darq"
version = "0.1"
dependencies = []

[tool.setuptools]
packages = ["darq", "darq.protocols", "darq.ui"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Fail on leaked sockets (and other resources).  The ResourceWarning is
# raised in a finaliser, where pytest reports it as unraisable, so that
# must be an error too.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
# Files without a .py extension must be listed explicitly.
include = [
    "darq/**/*.py",
    "tests/**/*.py",
    "kernel/pkernel",
    "kernel/pyloader",
    "bin/didlc",
    "bin/didlpygen",
    "bin/didlcgen",
    "services/history/main.py",
    "services/http/*.py",
    "services/index/main.py",
    "services/kb/*.py",
    "services/security/main.py",
    "services/storage/main.py",
    "services/type/main.py",
    "services/terminal/*.py",
    "lenses/book/*.py",
    "lenses/conversation/*.py",
    "lenses/entity/*.py",
    "lenses/image/main.py",
    "lenses/pdf/main.py",
    "lenses/text/main.py",
    "types/image/*.py",
    "types/kb/main.py",
    "types/pdf/*.py",
    "types/text/main.py",
    "tools/devterm/main.py",
    "tools/reindex/main.py",
    "tools/type-sync/main.py",
    "tools/librarything-import/*.py",
    "tools/slack-import/*.py",
    "tools/vcard-import/*.py",
    "bench/*.py",
]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
# The package re-exports its modules' contents.
"darq/__init__.py" = ["F401", "F403"]

[tool.pyright]
# The core runtime, p-kernel and tools.  The ZMQ-era services, runtime
# and type modules are added as they're ported to the new IPC.
include = [
    "darq/compositor.py",
    "darq/dipc.py",
    "darq/errors.py",
    "darq/identifier.py",
    "darq/index.py",
    "darq/kb.py",
    "darq/loop.py",
    "darq/message.py",
    "darq/book.py",
    "darq/url.py",
    "darq/pcall.py",
    "darq/process.py",
    "darq/protocols",
    "darq/system.py",
    "darq/version.py",
    "kernel/pkernel",
    "kernel/pyloader",
    "bin/didlc",
    "bin/didlpygen",
    "bin/didlcgen",
    "services/history/main.py",
    "services/http/*.py",
    "services/index/main.py",
    "services/kb/*.py",
    "services/security/main.py",
    "services/storage/main.py",
    "services/type/main.py",
    "services/terminal/*.py",
    "lenses/book/*.py",
    "lenses/conversation/*.py",
    "lenses/entity/*.py",
    "lenses/image/main.py",
    "lenses/pdf/main.py",
    "lenses/text/main.py",
    "types/image/*.py",
    "types/kb/main.py",
    "types/pdf/*.py",
    "types/text/main.py",
    "tools/devterm/main.py",
    "tools/reindex/main.py",
    "tools/type-sync/main.py",
    "tools/librarything-import/*.py",
    "tools/slack-import/*.py",
    "tools/vcard-import/*.py",
    "bench/*.py",
    "tests",
]
pythonVersion = "3.13"
