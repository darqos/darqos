# DarqOS backup configuration (see darqos-backup(8)), read by
# /darq/bin/darqos-backup, as shell assignments.  Install creates it,
# and leaves it alone after.

# Where snapshots are copied, with rsync, after each is taken: a
# directory, or host:directory over SSH (as root, with root's SSH key).
# Empty, they're only kept locally.
BACKUP_DEST=

# How many daily snapshots to keep, locally and at the destination.
KEEP=7

# Where they're kept locally.
SNAPSHOTS=/var/backups/darqos

# What's backed up.
RUN_DIR=/darq/run
